services:
  # ─── MongoDB replica set (required for Prisma transactions) ───
  mongodb:
    image: mongo:8.0
    container_name: scholarship-db
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-init:
    image: mongo:8.0
    restart: 'no'
    volumes:
      - ./backend/scripts/init-replica-set.js:/init-replica-set.js:ro
    entrypoint: ['mongosh', 'mongodb://mongodb:27017/admin?directConnection=true', '--quiet', '/init-replica-set.js']
    depends_on:
      mongodb:
        condition: service_healthy

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scholarship-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-Compatible Storage) ─────────────────────
  minio:
    image: minio/minio
    container_name: scholarship-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ─── Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarship-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: mongodb://mongodb:27017/scholarship_db?replicaSet=rs0&directConnection=true&serverSelectionTimeoutMS=5000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_change_in_production_32
      JWT_REFRESH_SECRET: super_secret_refresh_key_change_prod_32
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: scholarship-docs
      AWS_S3_ENDPOINT: http://minio:9000
      FRONTEND_URL: http://localhost:80
      PORT: 5000
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # ─── Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scholarship-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongodb_data:
  minio_data:
